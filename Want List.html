<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Want List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F2F4F9; --ink:#1A1F2E; --muted:#687087; --line:#E2E5EE;
  --accent:#2E54E8; --accent-ink:#FFFFFF;
  --top:#E4513A; --mid:#D69200; --low:#8B93A8;
  --shadow:0 10px 40px rgba(20,28,60,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161F; --surface:#1D2130; --ink:#EEF0F6; --muted:#9AA1B5; --line:#2B3042;
    --accent:#6F8BFF; --accent-ink:#0E1220;
    --top:#FF6B52; --mid:#F0B232; --low:#8A92A8;
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#13161F; --surface:#1D2130; --ink:#EEF0F6; --muted:#9AA1B5; --line:#2B3042;
  --accent:#6F8BFF; --accent-ink:#0E1220;
  --top:#FF6B52; --mid:#F0B232; --low:#8A92A8;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:28px 20px 120px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,8vw,3.4rem);line-height:.95;letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:999px;width:max-content;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
ol.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.row:hover{background:var(--surface)}
.rank{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;color:var(--muted);text-align:center}
.name{font-weight:600;line-height:1.3}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:2px}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem;border:3px solid currentColor}
.score.t-top{color:var(--top)} .score.t-mid{color:var(--mid)} .score.t-low{color:var(--low)}
.tier-head{font-size:.85rem;font-weight:600;color:var(--muted);margin:22px 4px 2px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.fab{position:fixed;right:max(20px,calc(50% - 280px));bottom:calc(24px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px 22px;border-radius:999px;box-shadow:var(--shadow);font-size:1rem}
.status{color:var(--muted);font-size:.8rem;margin-top:28px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:rise .22s ease-out}
@media (max-width:600px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:22px 22px 0 0;max-height:92%;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pick{transition:none!important}}
.sheet h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-.02em;line-height:1.1;margin:0 0 16px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--top)}
.btn:disabled{opacity:.45;cursor:default}
.tiers{display:grid;gap:10px}
.tierbtn{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px;text-align:left}
.tierbtn:hover{border-color:var(--ink)}
.tierbtn .dot{width:18px;height:18px}
.tierbtn span{display:block;color:var(--muted);font-size:.88rem}
.vs-q{text-align:center;margin:0 0 4px}
.progress{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:16px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .or{align-self:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--muted)}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;min-height:170px}
.pick:hover{border-color:var(--accent)}
.pick:active{transform:scale(.97)}
.pick .pn{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;line-height:1.15;letter-spacing:-.01em}
.pick .pp{font-weight:600}
.pick .pc{color:var(--muted);font-size:.85rem}
.pick .note{color:var(--muted);font-size:.88rem;font-style:italic;margin-top:auto}
.pick .new{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px}
.diff{text-align:center;color:var(--muted);font-size:.88rem;margin-top:12px;min-height:1.3em}
.keys{text-align:center;color:var(--muted);font-size:.8rem;margin-top:6px}
@media (max-width:460px){.vs{grid-template-columns:1fr}.vs .or{text-align:center}.keys{display:none}}
.result{text-align:center;padding:10px 0}
.result .score{width:96px;height:96px;font-size:2rem;border-width:5px;margin:8px auto 14px}
.detail-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.detail-top .score{flex:none}
.kv{color:var(--muted);margin:4px 0}
.kv a{color:var(--accent)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Want List</h1>
  <p class="sub" id="summary">Rank the things you want by comparing them two at a time.</p>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-act="tab" data-tab="list">Ranked</button>
    <button role="tab" aria-selected="false" data-act="tab" data-tab="bought">Got it</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="content"></div>
  <p class="status" id="status">Saved in this browser on your Mac</p>
  <div class="actions" style="justify-content:center">
    <button class="btn" data-act="export">Export backup</button>
    <button class="btn" data-act="import">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</main>
<button class="fab" data-act="add">+ Add item</button>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const KEY = "wantlist-v1";
const TIERS = {
  top:{label:"Really want it", hint:"Thinking about it a lot", range:[7,10], cls:"t-top", color:"var(--top)"},
  mid:{label:"Would be nice", hint:"Happy to have it someday", range:[4,6.9], cls:"t-mid", color:"var(--mid)"},
  low:{label:"Just curious", hint:"Passing interest", range:[0,3.9], cls:"t-low", color:"var(--low)"}
};
const ORDER = ["top","mid","low"];
let state = blank();
let view = "list", catFilter = null, flow = null, dbRef = null, saveTimer = null;

function blank(){ return {items:{}, tiers:{top:[],mid:[],low:[]}, bought:[]}; }
function normalize(s){
  const b = blank();
  if(!s || typeof s !== "object") return b;
  b.items = s.items || {};
  for(const t of ORDER) b.tiers[t] = (s.tiers && Array.isArray(s.tiers[t]) ? s.tiers[t] : []).filter(id=>b.items[id]);
  b.bought = (Array.isArray(s.bought) ? s.bought : []).filter(id=>b.items[id]);
  return b;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n || n === 0) && !isNaN(n) ? new Intl.NumberFormat(undefined,{style:"currency",currency:"USD",maximumFractionDigits:n%1?2:0}).format(n) : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
try { const raw = localStorage.getItem(KEY); if(raw) state = normalize(JSON.parse(raw)); } catch(e){}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}
function setStatus(t){ $("status").textContent = t; }

/* ---------- ranking ---------- */
function ranked(){
  const out = []; let pos = 0;
  for(const t of ORDER){
    const arr = state.tiers[t], n = arr.length, [lo,hi] = TIERS[t].range;
    arr.forEach((id,i) => {
      const score = hi - (hi-lo) * (i + 0.5) / n;
      out.push({item: state.items[id], tier:t, score: Math.round(score*10)/10, pos: ++pos});
    });
  }
  return out;
}
function scoreOf(id){ const r = ranked().find(x => x.item.id === id); return r; }
function removeFromTiers(id){ for(const t of ORDER) state.tiers[t] = state.tiers[t].filter(x => x !== id); }

/* ---------- main render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === view));
  const all = ranked();
  const total = all.reduce((s,r) => s + (Number(r.item.price) || 0), 0);
  $("summary").textContent = all.length
    ? `${all.length} ${all.length === 1 ? "thing" : "things"} on your list${total ? `, ${money(total)} in total` : ""}.`
    : "Rank the things you want by comparing them two at a time.";

  const cats = [...new Set(all.map(r => (r.item.category||"").trim()).filter(Boolean))].sort();
  if(catFilter && !cats.includes(catFilter)) catFilter = null;
  $("chips").innerHTML = view === "list" && cats.length > 1
    ? `<button class="chip" data-act="cat" data-cat="" aria-pressed="${!catFilter}">All</button>` +
      cats.map(c => `<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${catFilter===c}">${esc(c)}</button>`).join("")
    : "";

  const c = $("content");
  if(view === "list"){
    const rows = all.filter(r => !catFilter || (r.item.category||"").trim() === catFilter);
    if(!rows.length){
      c.innerHTML = `<div class="empty"><strong>Nothing ranked yet</strong>Add the first thing you've been eyeing. Each new item gets compared against the rest until it lands in the right spot.</div>`;
      return;
    }
    let html = "", lastTier = null;
    for(const r of rows){
      if(r.tier !== lastTier){
        if(lastTier) html += "</ol>";
        html += `<div class="tier-head"><span class="dot" style="background:${TIERS[r.tier].color}"></span>${TIERS[r.tier].label}</div><ol class="list">`;
        lastTier = r.tier;
      }
      html += rowHTML(r.pos, r.item, `<div class="score ${TIERS[r.tier].cls}" aria-label="Score ${r.score.toFixed(1)}">${r.score.toFixed(1)}</div>`);
    }
    c.innerHTML = html + "</ol>";
  } else {
    if(!state.bought.length){
      c.innerHTML = `<div class="empty"><strong>Nothing bought yet</strong>When you buy something, open it from your list and choose “Mark as bought.” It'll show up here.</div>`;
      return;
    }
    c.innerHTML = `<ol class="list">` + state.bought.map(id => {
      const it = state.items[id];
      const d = it.boughtAt ? new Date(it.boughtAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
      return rowHTML("✓", it, `<span class="meta">${esc(d)}</span>`);
    }).join("") + `</ol>`;
  }
}
function rowHTML(rank, it, right){
  const meta = [money(Number(it.price)), it.category].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");
  return `<li class="row" tabindex="0" data-act="open" data-id="${it.id}">
    <div class="rank">${rank}</div>
    <div><div class="name">${esc(it.name)}</div>${meta ? `<div class="meta">${meta}</div>` : ""}</div>
    ${right}</li>`;
}

/* ---------- sheet ---------- */
function openSheet(html){ $("sheet").innerHTML = html; $("scrim").classList.add("open"); const f = $("sheet").querySelector("input,button.pick,.tierbtn,button"); f && f.focus(); }
function closeSheet(){ $("scrim").classList.remove("open"); flow = null; }

function showForm(draft = {}){
  flow = {mode:"add", draft};
  openSheet(`<h2>${draft.id ? "Edit item" : "What do you want?"}</h2>
    <label for="f-name">Name</label><input id="f-name" maxlength="120" value="${esc(draft.name)}" placeholder="e.g. Film camera">
    <div class="two">
      <div><label for="f-price">Price</label><input id="f-price" inputmode="decimal" value="${esc(draft.price)}" placeholder="Optional"></div>
      <div><label for="f-cat">Category</label><input id="f-cat" maxlength="40" value="${esc(draft.category)}" placeholder="e.g. Tech" list="catlist"></div>
    </div>
    <datalist id="catlist">${[...new Set(Object.values(state.items).map(i => i.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label for="f-link">Link</label><input id="f-link" maxlength="500" value="${esc(draft.link)}" placeholder="Optional">
    <label for="f-note">Why you want it</label><textarea id="f-note" maxlength="300" placeholder="Optional, shown when comparing">${esc(draft.note)}</textarea>
    <div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="form-next">${draft.id ? "Save changes" : "Next"}</button></div>`);
}
function readForm(){
  const name = $("f-name").value.trim();
  if(!name){ $("f-name").focus(); $("f-name").placeholder = "Give it a name first"; return null; }
  const p = parseFloat($("f-price").value.replace(/[^0-9.]/g,""));
  return {...flow.draft, name, price: isNaN(p) ? "" : p, category: $("f-cat").value.trim(), link: $("f-link").value.trim(), note: $("f-note").value.trim()};
}
function showTier(item, mode){
  flow = {mode, item};
  openSheet(`<h2>How much do you want ${esc(item.name)}?</h2><div class="tiers">` +
    ORDER.map(t => `<button class="tierbtn" data-act="tier" data-tier="${t}"><span class="dot" style="background:${TIERS[t].color}"></span><div><strong>${TIERS[t].label}</strong><span>${TIERS[t].hint}</span></div></button>`).join("") +
    `</div><div class="actions"><button class="btn" data-act="close">Cancel</button></div>`);
}
function startCompare(tier){
  const arr = state.tiers[tier];
  flow.tier = tier; flow.lo = 0; flow.hi = arr.length; flow.step = 0;
  flow.total = Math.max(1, Math.ceil(Math.log2(arr.length + 1)));
  if(!arr.length) return place(0);
  showCompare();
}
function showCompare(){
  const {item, tier, lo, hi} = flow;
  const mid = Math.floor((lo + hi) / 2);
  flow.mid = mid;
  const other = state.items[state.tiers[tier][mid]];
  flow.step++;
  const a = Number(item.price), b = Number(other.price);
  let diff = "";
  if(a && b && a !== b) diff = `${esc(a > b ? item.name : other.name)} costs ${money(Math.abs(a-b))} more.`;
  else if(a && b) diff = "Same price.";
  openSheet(`<h2 class="vs-q">Which do you want more?</h2>
    <div class="progress">Comparison ${flow.step} of about ${Math.max(flow.step, flow.total)}</div>
    <div class="vs">${pickCard(item, "new")}<div class="or">or</div>${pickCard(other, "old")}</div>
    <div class="diff">${diff}</div>
    <div class="keys">Use ← and → to choose</div>
    <div class="actions" style="justify-content:center">
      <button class="btn" data-act="tie">Too close to call</button>
      <button class="btn" data-act="skip">Skip the rest</button>
    </div>`);
}
function pickCard(it, side){
  return `<button class="pick" data-act="pick" data-side="${side}">
    ${side === "new" ? `<span class="new">New</span>` : ""}
    <span class="pn">${esc(it.name)}</span>
    ${it.price !== "" && it.price != null ? `<span class="pp">${money(Number(it.price))}</span>` : ""}
    ${it.category ? `<span class="pc">${esc(it.category)}</span>` : ""}
    ${it.note ? `<span class="note">“${esc(it.note)}”</span>` : ""}
  </button>`;
}
function choose(side){
  if(!flow || flow.mid == null) return;
  if(side === "new") flow.hi = flow.mid; else flow.lo = flow.mid + 1;
  if(flow.lo >= flow.hi) place(flow.lo); else showCompare();
}
function place(index){
  const {item, tier} = flow;
  state.items[item.id] = item;
  removeFromTiers(item.id);
  state.bought = state.bought.filter(x => x !== item.id);
  delete item.boughtAt;
  state.tiers[tier].splice(index, 0, item.id);
  save(); view = "list"; render();
  const r = scoreOf(item.id);
  flow = {mode:"done"};
  openSheet(`<div class="result">
    <h2>${esc(item.name)}</h2>
    <div class="score ${TIERS[r.tier].cls}">${r.score.toFixed(1)}</div>
    <p class="kv">Number ${r.pos} of ${ranked().length} on your list</p>
    <div class="actions" style="justify-content:center"><button class="btn" data-act="close">Done</button><button class="btn primary" data-act="add">Add another</button></div>
  </div>`);
}
function showDetail(id){
  const it = state.items[id]; if(!it) return;
  const r = scoreOf(id), isBought = state.bought.includes(id);
  flow = {mode:"detail", id};
  const safeLink = /^https?:\/\//i.test(it.link || "") ? it.link : (it.link ? "https://" + it.link : "");
  openSheet(`<div class="detail-top"><h2>${esc(it.name)}</h2>${r ? `<div class="score ${TIERS[r.tier].cls}">${r.score.toFixed(1)}</div>` : ""}</div>
    ${r ? `<p class="kv">Number ${r.pos} on your list, in ${TIERS[r.tier].label.toLowerCase()}</p>` : ""}
    ${it.price !== "" && it.price != null ? `<p class="kv">${money(Number(it.price))}</p>` : ""}
    ${it.category ? `<p class="kv">${esc(it.category)}</p>` : ""}
    ${safeLink ? `<p class="kv"><a href="${esc(safeLink)}" target="_blank" rel="noopener">Open link</a></p>` : ""}
    ${it.note ? `<p class="kv"><em>“${esc(it.note)}”</em></p>` : ""}
    <div class="actions">
      <button class="btn danger" data-act="delete">Delete</button>
      <button class="btn" data-act="edit">Edit</button>
      ${isBought ? `<button class="btn primary" data-act="rerank">Put back on list</button>`
                 : `<button class="btn" data-act="rerank">Re-rank</button><button class="btn primary" data-act="bought">Mark as bought</button>`}
    </div>`);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(e.target === $("scrim")) return closeSheet();
  if(!el) return;
  const act = el.dataset.act;
  if(act === "tab"){ view = el.dataset.tab; render(); }
  else if(act === "export"){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `want-list-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setStatus("Backup downloaded");
  }
  else if(act === "import") $("importFile").click();
  else if(act === "cat"){ catFilter = el.dataset.cat || null; render(); }
  else if(act === "add") showForm();
  else if(act === "close") closeSheet();
  else if(act === "open") showDetail(el.dataset.id);
  else if(act === "form-next"){
    const item = readForm(); if(!item) return;
    if(item.id && state.items[item.id]){ state.items[item.id] = item; save(); render(); showDetail(item.id); }
    else { item.id = uid(); item.added = Date.now(); showTier(item, "add"); }
  }
  else if(act === "tier") startCompare(el.dataset.tier);
  else if(act === "pick") choose(el.dataset.side);
  else if(act === "tie") place(flow.mid);
  else if(act === "skip") place(Math.floor((flow.lo + flow.hi) / 2));
  else if(act === "edit") showForm({...state.items[flow.id]});
  else if(act === "rerank"){ const it = state.items[flow.id]; removeFromTiers(it.id); state.bought = state.bought.filter(x => x !== it.id); save(); render(); showTier(it, "rerank"); }
  else if(act === "bought"){ const id = flow.id; removeFromTiers(id); state.items[id].boughtAt = Date.now(); state.bought.unshift(id); save(); render(); closeSheet(); }
  else if(act === "delete"){
    if(el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Tap again to delete"; return; }
    const id = flow.id; removeFromTiers(id); state.bought = state.bought.filter(x => x !== id); delete state.items[id]; save(); render(); closeSheet();
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("scrim").classList.contains("open")) return closeSheet();
  if(flow && flow.mid != null && $("scrim").classList.contains("open") && document.querySelector(".pick")){
    if(e.key === "ArrowLeft"){ e.preventDefault(); choose("new"); }
    if(e.key === "ArrowRight"){ e.preventDefault(); choose("old"); }
  }
  if(e.key === "Enter" && e.target.classList && e.target.classList.contains("row")) showDetail(e.target.dataset.id);
  if(e.key === "Enter" && e.target.tagName === "INPUT" && flow && flow.mode === "add"){ e.preventDefault(); document.querySelector('[data-act="form-next"]').click(); }
});

$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const data = normalize(JSON.parse(await f.text()));
    if(!Object.keys(data.items).length) throw new Error("empty");
    if(Object.keys(state.items).length && !confirm("Replace your current list with this backup?")) return;
    state = data; save(); render(); setStatus("Backup imported");
  } catch(err){ setStatus("That file isn't a Want List backup. Choose a file made with Export backup."); }
  e.target.value = "";
});
render();
</script>
</body>
</html>
